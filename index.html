<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinTech Guide to Orlando Theme Parks</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every ride and show at Magic Kingdom, EPCOT, and the three Universal parks, rated by Sean and Kassie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FC; --card:#FFFFFF; --ink:#121A33; --muted:#586082; --line:#DCE2F0; --soft:#ECF0F9;
  --nav:#FFFFFF; --track:#E3E8F4;
  --sean-bg:#FFF2CC; --sean-ink:#4A3500; --sean-line:#E7B83C; --sean-name:#8A5A00;
  --kas-bg:#FCE3F2; --kas-ink:#561644; --kas-line:#D86BB5; --kas-name:#9A2C7E;
  --mk:#2B59E0; --epcot:#0A8A8E; --usf:#D8402F; --ioa:#37873B; --epic:#7B43D6;
  --accent:#2B59E0;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1325; --card:#151D38; --ink:#EDF0FA; --muted:#A3ACCB; --line:#27315A; --soft:#1B2547;
    --nav:#111A33; --track:#222C52;
    --sean-bg:#3A2E0C; --sean-ink:#FFE9A8; --sean-line:#9A7A1E; --sean-name:#F2C94C;
    --kas-bg:#3A1631; --kas-ink:#FFD3EF; --kas-line:#A84A8C; --kas-name:#FF9AD8;
    --mk:#7C9BFF; --epcot:#4FD1D3; --usf:#FF8A7A; --ioa:#7FD783; --epic:#B792FF;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1325; --card:#151D38; --ink:#EDF0FA; --muted:#A3ACCB; --line:#27315A; --soft:#1B2547;
  --nav:#111A33; --track:#222C52;
  --sean-bg:#3A2E0C; --sean-ink:#FFE9A8; --sean-line:#9A7A1E; --sean-name:#F2C94C;
  --kas-bg:#3A1631; --kas-ink:#FFD3EF; --kas-line:#A84A8C; --kas-name:#FF9AD8;
  --mk:#7C9BFF; --epcot:#4FD1D3; --usf:#FF8A7A; --ioa:#7FD783; --epic:#B792FF;
}
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.wrap.wide{max-width:1100px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);border-bottom:1px solid var(--line)}
.bar .wrap{max-width:1180px;display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;text-decoration:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 11px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline;background:var(--c,var(--muted))}
.tab[aria-current="page"] .dot{box-shadow:0 0 0 2px var(--paper)}
.grp{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 2px 0 10px;white-space:nowrap;align-self:center}
.here,.menubtn{display:none}
.menubtn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.menupanel{position:absolute;left:0;right:0;top:100%;background:var(--nav);border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.12);padding:6px 20px 16px;max-height:calc(100vh - 70px);overflow:auto}
.menupanel[hidden]{display:none}
.menupanel h4{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.menupanel a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px}
.menupanel a[aria-current="page"]{background:var(--soft)}
.menupanel .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
@media(max-width:759px){.brand{display:none}.tabs{display:none}.here{display:block;flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.menubtn{display:block}}
.mode{border:1px solid var(--line);background:var(--card);border-radius:999px;width:36px;height:36px;cursor:pointer;flex:none;font-size:16px;line-height:1}

/* hero */
.hero{padding:52px 0 30px}
.hero h1{font-size:clamp(38px,7.2vw,72px);font-weight:800;max-width:15ch}
.hero .sub{font-size:19px;color:var(--ink);max-width:54ch;margin-top:18px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.cta{display:inline-block;background:var(--c);color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;border-radius:12px;padding:14px 22px}
:root[data-theme="dark"] .cta,:root:not([data-theme="light"]) .cta{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .cta{color:#fff}}
.cta:hover{filter:brightness(1.08)}
.uni-note{margin-top:14px;color:var(--muted);font-size:15.5px;max-width:58ch}
.uni-note a{font-weight:600}
.legend{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.legend h3{font-size:17px;margin-bottom:10px}
.legend small{color:var(--muted);display:block;margin-top:8px;font-size:13.5px;line-height:1.45}
.flame-row{display:flex;gap:14px;align-items:baseline;font-size:15px;margin:7px 0}
.flame-row .fl{flex:none;width:112px;white-space:nowrap}
.section{padding:30px 0}
.section>h2,.wrap>h2{font-size:clamp(26px,4vw,36px);margin-bottom:16px;font-weight:700}
.note-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.note-list li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:12px;padding:14px 16px}
.note-list li.warn{border-left-color:#E0A100}
.note-list b{font-family:var(--display);font-weight:700}
.note-list ul{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.note-list li li{border:0;border-left:3px solid var(--line);border-radius:0;padding:2px 0 2px 12px;background:transparent}
.parkgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.parkgrid.two{grid-template-columns:1fr 1fr}.parkgrid.three{grid-template-columns:repeat(3,1fr)}}
.lede{color:var(--muted);margin:-6px 0 16px;max-width:60ch}
.pcard{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:6px 6px 18px 18px;padding:20px 20px 18px;text-decoration:none}
.pcard:hover{border-color:var(--c)}
.pcard h3{font-size:26px;color:var(--ink)}
.pcard p{margin-top:10px;color:var(--ink)}
.pcard .lead{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.35}
.pcard .stats{margin-top:14px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.pcard .hrs{margin-top:10px;font-size:13.5px;color:var(--muted)}
.pcard{display:flex;flex-direction:column}
.pcard .picks{margin-top:12px;font-size:14.5px;color:var(--ink)}
.pcard .picks b{font-family:var(--display)}
.pcard .go{margin-top:auto;padding-top:16px}
.pcard .go span{display:block;text-align:center;background:var(--c);color:#fff;font-family:var(--display);font-weight:700;border-radius:10px;padding:11px 14px}
:root[data-theme="dark"] .pcard .go span,:root:not([data-theme="light"]) .pcard .go span{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pcard .go span{color:#fff}}

/* park header */
.phead{background:var(--c);color:#fff;padding:38px 0 30px}
:root[data-theme="dark"] .phead,:root:not([data-theme="light"]) .phead{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .phead{color:#fff}}
.phead h1{font-size:clamp(34px,6vw,58px);font-weight:800}
.phead p{margin-top:12px;font-size:18px;max-width:60ch}
.phead .more{margin-top:10px;font-size:15px;opacity:.9}
.infogrid{display:grid;gap:14px;margin:22px 0 4px}
@media(min-width:760px){.infogrid.two{grid-template-columns:1fr 1fr}}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.info h3{font-size:18px;margin-bottom:8px}
.info ul{margin:0;padding-left:18px}
.info li{margin:4px 0}
.info.closed{border-left:5px solid #E0A100}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 6px}
.stab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.stab[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
:root[data-theme="dark"] .stab[aria-pressed="true"],:root:not([data-theme="light"]) .stab[aria-pressed="true"]{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .stab[aria-pressed="true"]{color:#fff}}

/* filters */
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--paper);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.frow:first-child{margin-top:0}
.filters input[type=search],.filters select{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;min-width:0}
.filters input[type=search]{flex:1 1 200px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flab{font-size:13.5px;color:var(--muted);margin-right:2px}
.count{margin-left:auto;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);padding:4px}
.scalenote{font-size:13.5px;color:var(--muted);margin:2px 0 14px}

/* ride card */
.cards{display:grid;gap:18px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px}
.rc-top{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.rc h3{font-size:24px;font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.badge.sr{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.badge.new{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge.warn{background:#FFE9A8;color:#4A3500;border-color:#E7B83C}
.thrill{flex:none;text-align:right;white-space:nowrap}
.thrill .fls{display:block;font-size:18px;letter-spacing:1px;line-height:1.2}
.thrill .off{filter:grayscale(1);opacity:.22}
.thrill .mid{opacity:.55}
.thrill small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:2px}
.tldr{font-family:var(--display);font-weight:600;font-size:18px;margin-top:12px;color:var(--c)}
.desc{margin-top:8px;text-wrap:pretty}
.waitrow{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;margin-top:16px}
.waitlabel{font-size:14px;line-height:1.25}
.waitlabel b{display:block;font-family:var(--display);font-size:17px}
.waitlabel span{color:var(--muted);font-size:12.5px}
.track{position:relative;height:12px;border-radius:7px;background:var(--track);overflow:hidden}
.track .seg{position:absolute;top:0;bottom:0;background:var(--c);border-radius:7px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--paper);opacity:.85}
.nowait{font-size:14px;color:var(--muted)}
.voices{display:grid;gap:12px;margin-top:18px;grid-template-columns:1fr}
@media(min-width:700px){.voices{grid-template-columns:1fr 1fr}}
.voice{border-radius:14px;padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:6px}
.voice.sean{background:var(--sean-bg);color:var(--sean-ink);border-color:var(--sean-line)}
.voice.kas{background:var(--kas-bg);color:var(--kas-ink);border-color:var(--kas-line)}
.vhead{display:flex;align-items:baseline;gap:8px}
.vname{font-family:var(--display);font-weight:700;font-size:15px}
.sean .vname{color:var(--sean-name)}.kas .vname{color:var(--kas-name)}
.score{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.score small{font-size:14px;font-weight:600;opacity:.7}
.vlabel{font-size:13.5px;opacity:.85}
.vtext{font-family:var(--serif);font-size:17px;line-height:1.45;white-space:pre-line}
.vtext.empty{font-family:var(--sans);font-size:14px;opacity:.7;font-style:italic}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.kw{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.thnote{margin-top:10px;font-size:14px;color:var(--muted)}

/* show cards (lighter) */
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.sc h3{font-size:21px}
.sc .desc{margin-top:6px}
.sc .voices{margin-top:14px}

/* lists */
.top2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.top2{grid-template-columns:1fr 1fr}}
.toplist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.toplist h3{font-size:20px;margin-bottom:8px}
.toplist ol{margin:0;padding-left:24px}
.toplist li{margin:5px 0}
.meets{columns:2 280px;column-gap:28px;padding-left:20px;margin:0}
.meets li{break-inside:avoid;margin:5px 0}
.morebox{margin-top:40px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:6px 6px 18px 18px;padding:22px 22px 24px}
.morebox:empty{display:none}
.morebox h2{font-size:24px;margin-bottom:6px}
.morebox .lede{margin:0 0 14px}
.morerow{display:flex;flex-wrap:wrap;gap:10px}
.morebtn{border:0;background:var(--c);color:#fff;border-radius:12px;padding:13px 20px;font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
:root[data-theme="dark"] .morebtn,:root:not([data-theme="light"]) .morebtn{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .morebtn{color:#fff}}
.morebtn:hover{filter:brightness(1.08)}
.explore{margin-top:44px;border-top:1px solid var(--line);padding-top:24px}
.explore h2{font-size:24px;margin-bottom:12px}
.explore .chips{display:flex;flex-wrap:wrap;gap:10px}
.explore a{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;text-decoration:none}
.explore a i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* comments */
.cm{margin-top:16px}
.cm-toggle{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
.cm-toggle.has{border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.cm-toggle:hover{background:var(--soft)}
.cm-panel{margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
.cm-panel[hidden]{display:none}
.cm-list{display:grid;gap:10px;margin-bottom:14px}
.cm-item{background:var(--soft);border-radius:12px;padding:10px 14px}
.cm-item b{font-family:var(--display);font-size:15px}
.cm-item time{color:var(--muted);font-size:13px;margin-left:8px}
.cm-item p{margin-top:4px;white-space:pre-line;overflow-wrap:anywhere}
.cm-empty{color:var(--muted);font-size:14.5px}
.cm-form{display:grid;gap:8px}
.cm-form input,.cm-form textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.cm-form textarea{resize:vertical;min-height:84px}
.cm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cm-post{border:0;background:var(--c,var(--accent));color:#fff;border-radius:10px;padding:10px 18px;font-family:var(--display);font-weight:700;cursor:pointer}
:root[data-theme="dark"] .cm-post,:root:not([data-theme="light"]) .cm-post{color:#0B1226}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .cm-post{color:#fff}}
.cm-post[disabled]{opacity:.6;cursor:default}
.cm-msg{font-size:14px;color:var(--muted)}
.cm-msg.err{color:#C43A2B}
.cm-note{font-size:12.5px;color:var(--muted)}
.cm-jump{margin-top:14px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
.pcomments{padding-top:34px}
.pcomments h2{font-size:24px;margin-bottom:12px}
.empty-state{padding:30px 0;color:var(--muted)}

/* compare */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--card);font-family:var(--display);font-weight:700;font-size:14px}
th button{background:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:0;display:inline-flex;gap:4px;align-items:center}
tr:last-child td{border-bottom:0}
td .pk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
td .pk i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c)}
td.num{font-family:var(--display);font-weight:700}
td .mini{width:150px}
td .mini .track{height:9px}
.dim{color:var(--muted)}

footer{margin-top:56px;border-top:1px solid var(--line);padding:30px 0 56px;color:var(--muted);font-size:14.5px}
footer h3{font-size:17px;color:var(--ink);margin-bottom:8px}
footer p+p{margin-top:8px}
@media (prefers-reduced-motion:no-preference){
  .track .seg{animation:grow .7s ease-out both;transform-origin:left}
  @keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
}
@media(max-width:699px){.filters{position:static}}
@media print{.bar,.filters,.subtabs,.mode{display:none!important}.rc,.sc{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<header class="bar" style="position:sticky">
  <div class="wrap">
    <a class="brand" href="#overview">Orlando guide</a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <span class="here" id="here"></span>
    <button class="menubtn" id="menu" aria-expanded="false" aria-controls="menupanel">Menu: all parks</button>
    <button class="mode" id="mode" aria-label="Switch between light and dark mode" title="Light or dark">◐</button>
  </div>

<script id="data" type="application/json">{"title": "FinTech Guide to Orlando Theme Parks", "overview": {"bullets": [[0, "Magic Kingdom: if you like Disney or classic nostalgia, this is the park for you. It has the most rides and entertainment, though the majority of those rides are not thrill rides – they’re more about immersion and storytelling. There are ~4 I’d call a thrill ride, but nothing as intense as you’d get at Universal"], [0, "EPCOT: EPCOT has less of the “DISNEY” vibe overall than Magic Kingdom, so if your first reaction was “oh gods, we’re going to Disney?” then EPCOT is likely your better choice. This is more of a cultural experience where the main attraction is the World Showcase with 11 country themed mini-lands. Walking 5 minutes and “being in” another country, complete with local food and drinks, is one of the main appeals. There are less rides in total, but it has a few of each kind – slow character based rides and a few faster thrill rides"], [0, "Universal: they have more intense thrill rides along with movie themed rides. A lot of “screen-based” rides with projectors."], [0, "Other Disney World parks – we currently aren’t planning on these being options based on logistics. Magic Kingdom and EPCOT are both directly accessible from the main parking area, making it easy for people to split between those parks. Getting to these other two require multiple transfers on Disney trains/busses:"], [1, "Hollywood Studios: the main draw here is it’s where all the Star Wars rides/lands are. It also has Sean’s favorite nighttime show, Fantasmic!"], [1, "Animal Kingdom: the smallest of the 4, with a focus around wildlife including a drive through safari with real animals. This is also where the Avatar themed land is"], [0, "Alternative: you can just hang out at the house and chill/relax if you aren’t into the theme park idea!"], [0, "Heads up: we do not yet have approval to split the group between Walt Disney World and Universal. That adds logistical challenges we weren’t planning on so TBD on Universal being an option"], [0, "Avg wait times: I’ve included this based on a couple queue tracker websites. My gut is they’re a tad under reported, likely because the first hour or two of the day and the last hour or two of the day pull down the average. But it’s still a good rough approximation."]], "ai": ["Sean and Kassie created keywords, thrill ratings, personal ratings, and personal commentary.", "Claude wrote the ride and show descriptions and one-line summaries from official park descriptions, pulled the average wait times, single rider notes, and Jan 20 and 21 hours, wrote the Universal park intros, and proofread. It also drafted keywords for the Universal rides and the entertainment listings."], "legend": [["🔥", "Very slow, no drops/shocks/surprises, no spinning"], ["🔥🔥", "Still very mild, but may have a spinning or a single small drop"], ["🔥🔥🔥", "More action packed"], ["🔥🔥🔥🔥", "Standard rollercoaster with at least moderate intensity"], ["🔥🔥🔥🔥🔥", "Cedar Point / Six Flags style hypercoaster (Magic Kingdom, EPCOT, and Universal don’t have any of these)"]]}, "parks": [{"key": "mk", "sheet": "Magic Kingdom", "intro": [[0, "This is exactly what comes to mind when you think of Disney World/Disneyland"]], "rides": [{"name": "Astro Orbiter", "desc": "A retro two-seat rocket lifts you high above Tomorrowland and circles a cluster of planets. A lever lets you control how high you fly.", "tldr": "High-up spinner you steer for height", "extras": [], "thrill": {"min": 2, "max": 2}, "thrillNote": "", "sean": {"lo": 5.0, "hi": null, "label": "", "comment": "Kind of cool it’s up high I suppose. There are three versions of this style ride in Magic Kingdom though"}, "kassie": {"lo": 6.0, "hi": null, "label": "", "comment": "I feel like I usually skip this in favor of dumbo"}, "keywords": ["Elevated", "Tomorrowland", "Sci-fi", "Spinning", "Outdoors"], "wait": {"lo": 11, "hi": 19}, "single": false, "singleNote": "", "badge": ""}, {"name rough the treehouse built by the shipwrecked Swiss Family Robinson, inspired by the 1960 Disney film. 116 steps to the top, with 360° views.", "tldr": "Walk-through with lots of stairs", "extras": [], "thrill": {"min": 1, "max": 1}, "thrillNote": "", "sean": {"lo": 6.0, "hi": null, "label": "", "comment": "Good theming and it’s unique in that you walk through it on your own."}, "kassie": {"v": null, "label": "", "comment": ""}, "keywords": ["Chill", "Walkthrough", "Stairs", "Outdoors", "Adventureland", "Opening Day"], "wait": {"lo": 5, "hi": 5}, "single": false, "singleNote": "", "badge": ""}, {"name": "Tiana’s Bayou Adventure", "desc": "A musical flume ride with Princess Tiana and Louis the alligator that ends in a 50-foot drop. There's a strong chance you'll get wet.", "tldr": "Musical flume with a big drop", "extras": [], "thrill": {"min": 3, "max": 3}, "thrillNote": "", "sean": {"v": null, "label": "Splash Mountain was a 10", "comment": "I have not ridden this since they changed it from Splash Mountain to Tiana a couple years ago. Splash was probably my #1 favorite Disney ride (10/10) so I have feelings about that; however since it’s the same ride just with a different story and characters, I suspect the new version is very good. You will get wet from the big drop."}, "kassie": {"v": null, "label": "", "comment": "haven't ridden the new version but Splash Mountain is indeed a 10"}, "keywords": ["Wet", "Music", "Disney characters", "Drop", "Indoors", "Animatronics", "Frontierland"], "wait": {"lo": 30, "hi": 60}, "single": false, "singleNote": "", "badge": ""}, {"name": "Tomorrowland Speedway", "desc": "Drive a gas-powered car along a miniature motorway with a working gas pedal and steering wheel.", "tldr": "Go-karts on rails", "extras": [], "thrill": {"min": 1, "max": 1}, "thrillNote": "", "sean": {"lo": 5.0, "hi": null, "label": "", "comment": "No need to ride this given we’re all adults that can drive real cars. Very cool experience for kids though. They’re fin     var q=S.q.toLowerCase();

    if(hay.indexOf(q)<0) return false;
  }
  if(S.th.length){
    if(!r.thrill||r.thrill.min==null) return false;
    var ok=S.th.some(function(t){return t>=r.thrill.min&&t<=r.thrill.max});
    if(!ok) return false;
  }
  if(S.wait){
    var a=avg(r.wait); if(a==null) return false;
    if(S.wait==='short'&&!(a<20)) return false;
    if(S.wait==='med'&&!(a>=20&&a<45)) return false;
    if(S.wait==='long'&&!(a>=45)) return false;
  }
  if(S.sr&&!r.single) return false;
  var kw=r.keywords.join(' ').toLowerCase();
  if(S.ind&&kw.indexOf('indoor')<0) return false;
  if(S.out&&kw.indexOf('outdoor')<0) return false;
  return true;
}
function sortRides(list,S){
  var a=list.slice();
  function sv(v){return v&&v.lo!=null?(v.lo+(v.hi!=null?v.hi:v.lo))/2:-1}
  if(S.sort==='thrill') a.sort(function(x,y){return ((y.thrill&&y.thrill.max)||-1)-((x.thrill&&x.thrill.max)||-1)});
  else if(S.sort==='wait') a.sort(function(x,y){var p=avg(x.wait),q=avg(y.wait);return (p==null?999:p)-(q==null?999:q)});
  else if(S.sort==='sean') a.sort(function(x,y){return sv(y.sean)-sv(x.sean)});
  else if(S.sort==='kassie') a.sort(function(x,y){return sv(y.kassie)-sv(x.kassie)});
  return a;
}
function ridesPanel(pk,S,redrawTabs){
  var wrap=h('div');
  var list=h('div',{class:'cards'});
  var count=h('span',{class:'count'});
  function paint(){
    clear(list);
    var rs=sortRides(pk.rides.filter(function(r){return matchRide(r,S)}),S);
    count.textContent='Showing '+rs.length+' of '+pk.rides.length;
    if(!rs.length) list.appendChild(h('p',{class:'empty-state',text:'No rides match those filters. Clear a filter or two to see more.'}));
    rs.forEach(function(r){list.appendChild(rideCard(r,pk))});
  }
  var search=h('input',{type:'search',placeholder:'Search rides or keywords','aria-label':'Search rides',value:S.q,oninput:function(e){S.q=e.target.value;paint()}});
  var thr=h('span',null);
  function thrChips(){
    clear(thr);
    for(var i=1;i<=5;i++)(function(i){
      var on=S.th.indexOf(i)>=0;
      thr.appendChild(h('button',{class:'chip','aria-pressed':on?'true':'false','aria-label':i+' flame'+(i>1?'s':''),onclick:function(){var ix=S.th.indexOf(i);if(ix>=0)S.th.splice(ix,1);else S.th.push(i);thrChips();paint()}},new Array(i+1).join(FIRE)));
    })(i);
  }
  thrChips();
  var waitSel=h('select',{'aria-label':'Wait time',onchange:function(e){S.wait=e.target.value;paint()}},
    h('option',{value:'',raw:'Any wait'}),h('option',{value:'short',raw:'Short: under 20 min'}),h('option',{value:'med',raw:'Medium: 20 to 45 min'}),h('option',{value:'long',raw:'Long: 45+ min'}));
  waitSel.value=S.wait;
  var sortSel=h('select',{'aria-label':'Sort rides',onchange:function(e){S.sort=e.target.value;paint()}},
    h('option',{value:'doc',raw:'Sort: as listed'}),h('option',{value:'thrill',raw:'Sort: most thrilling'}),h('option',{value:'wait',raw:'Sort: shortest wait'}),h('option',{value:'sean',raw:'Sort: Sean’s score'}),h('option',{value:'kassie',raw:'Sort: Kassie’s score'}));
  sortSel.value=S.sort;
  function tog(label,key){
    return h('button',{class:'chip','aria-pressed':S[key]?'true':'false',onclick:function(e){S[key]=!S[key];e.currentTarget.setAttribute('aria-pressed',S[key]?'true':'false');paint()}},label);
  }
  var clearBtn=h('button',{class:'linkbtn',onclick:function(){S.q='';S.th=[];S.wait='';S.sr=false;S.ind=false;S.out=false;S.sort='doc';redrawTabs()}},'Clear filters');
  var f=h('div',{class:'filters'},
    h('div',{class:'frow'},search,waitSel,sortSel),
    h('div',{class:'frow'},h('span',{class:'flab',text:'Thrill'}),thr,tog('Single rider','sr'),tog('Indoors','ind'),tog('Outdoors','out'),clearBtn,count));
  wrap.appendChild(f);
  wrap.appendChild(h('p',{class:'scalenote',text:'Wait bars all use the same 0 to 140 minute scale, so they’re directly comparable. Waits are averages, so busy evenings and holidays can run longer.'}));
  wrap.appendChild(list);
  paint();
  return wrap;
}
function showsPanel(pk){
  var w=h('div',{class:'section'});
  w.appendChild(h('h2',{text:'Shows and entertainment'}));
  var list=h('div',{class:'cards'});
  pk.shows.forEach(function(s){list.appendChild(showCard(s,pk))});
  w.appendChild(list); return w;
}
function topPanel(pk){
  var w=h('div',{class:'section'});
  w.appendChild(h('h2',{text:'Kassie & Sean’s Top Picks'}));
  var g=h('div',{class:'top2'});
  Object.keys(pk.top5).forEach(function(who){
    if(!pk.top5[who].length) return;
    g.appendChild(h('div',{class:'toplist'},h('h3',{text:who+'’s picks'}),h('ol',null,pk.top5[who].map(function(x){return h('li',{text:x})}))));
  });
  w.appendChild(g); return w;
}

function allRides(){
  var out=[];
  ORDER.forEach(function(k){PARK[k].rides.forEach(function(r){out.push({r:r,k:k})})});
  return out;
}
function compareView(){
  var root=h('div',{class:'wrap wide'});
  root.appendChild(h('section',{class:'section'},h('h2',{text:'Compare every ride'}),
    h('p',{class:'scalenote',text:'Click a column heading to sort. Wait bars all use the same 0 to 140 minute scale.'})));
  var chips=h('div',{class:'frow',style:'margin-bottom:14px'});
  var tbl=h('div',{class:'tablewrap'});
  function sv(v){return v&&v.lo!=null?(v.lo+(v.hi!=null?v.hi:v.lo))/2:-1}
  function val(x,key){
    var r=x.r;
    if(key==='name') return r.name.toLowerCase();
    if(key==='park') return ORDER.indexOf(x.k);
    if(key==='thrill') return r.thrill&&r.thrill.max!=null?r.thrill.max:-1;
    if(key==='sean') return sv(r.sean);
    if(key==='kassie') return sv(r.kassie);
    if(key==='wait'){var a=avg(r.wait);return a==null?-1:a}
    if(key==='sr') return r.single?1:0;
  }
  function draw(){
    clear(chips);
    [['all','All parks']].concat(ORDER.map(function(k){return [k,META[k].name]})).forEach(function(p){
      chips.appendChild(h('button',{class:'chip','aria-pressed':CMP.park===p[0]?'true':'false',onclick:function(){CMP.park=p[0];draw()}},p[1]));
    });
    var rows=allRides().filter(function(x){return CMP.park==='all'||x.k===CMP.park});
    rows.sort(function(a,b){var p=val(a,CMP.key),q=val(b,CMP.key);return (p<q?-1:p>q?1:0)*CMP.dir});
    var cols=[['name','Ride'],['park','Park'],['thrill','Thrill (of 5)'],['sean','Sean (of 10)'],['kassie','Kassie (of 10)'],['wait','Wait on average'],['sr','Single rider']];
    var thead=h('tr',null,cols.map(function(c){
      var on=CMP.key===c[0];
      return h('th',{'aria-sort':on?(CMP.dir>0?'ascending':'descending'):'none'},h('button',{onclick:function(){if(CMP.key===c[0])CMP.dir*=-1;else{CMP.key=c[0];CMP.dir=(c[0]==='name'||c[0]==='park')?1:-1}draw()}},c[1],on?(CMP.dir>0?' \u25B2':' \u25BC'):''));
    }));
    var tbody=h('tbody',null,rows.map(function(x){
      var r=x.r,m=META[x.k];
      var th=r.thrill&&r.thrill.min!=null?(r.thrill.min===r.thrill.max?String(r.thrill.min):r.thrill.min+'\u2013'+r.thrill.max):'\u2013';
      function sc(v){return v&&v.lo!=null?scoreText(v):'\u2013'}
      var wt=r.wait?h('div',{class:'mini',style:'--c:'+m.c},h('div',{style:'font-size:13px;margin-bottom:3px',raw:rangeText(r.wait)}),waitBar(r.wait)):h('span',{class:'dim',text:'No data'});
      return h('tr',null,
        h('td',null,h('a',{href:'#'+x.k,text:r.name})),
        h('td',null,h('span',{class:'pk',style:'--c:'+m.c},h('i'),m.name)),
        h('td',{class:'num',raw:th}),h('td',{class:'num',raw:sc(r.sean)}),h('td',{class:'num',raw:sc(r.kassie)}),
        h('td',null,wt),
        h('td',{raw:r.single?'Yes':''}));
    }));
    clear(tbl);
    tbl.appendChild(h('table',null,h('thead',null,thead),tbody));
  }
  root.appendChild(chips); root.appendChild(tbl);
  draw();
  return h('div',null,root);
}

function footer(){
  var f=document.getElementById('foot'); clear(f);
  f.appendChild(h('h3',{text:'How this was made'}));
  DATA.overview.ai.forEach(function(t){f.appendChild(h('p',{text:t}))});
  f.appendChild(h('p',{text:'Wait times are averages from queue-tracking sites. Hours and closures are as of Nov 19, 2026, so check the park apps before you go.'}));
}

function route(){
  var k=(location.hash||'#overview').slice(1);
  if(k!=='overview'&&k!=='compare'&&!PARK[k]) k='overview';
  CM.subs=[];
  var app=document.getElementById('app'); clear(app);
  if(k==='overview') app.appendChild(overview());
  else if(k==='compare') app.appendChild(compareView());
  else app.appendChild(parkView(k));
  setTabs(k);
  document.title=(k==='overview'?DATA.title:curLabel(k)+' | '+DATA.title);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.getElementById('menu').addEventListener('click',function(){
  var p=document.getElementById('menupanel'); p.hidden=!p.hidden; this.setAttribute('aria-expanded',p.hidden?'false':'true');
});
document.getElementById('mode').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');
});
footer(); route(); cmLoad();
if(CM.on) setInterval(function(){if(!document.hidden) cmLoad()},20000);
})();

</script>
